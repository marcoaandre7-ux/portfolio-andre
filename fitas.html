function buildShelf(){stage.replaceChildren();tapes.length=0;const n=projects.length;if(!n){document.querySelector('.caption h2').textContent='No projects yet';document.querySelector('.type').textContent='No matching public repositories found.';return} s=n;target=n;active=-1;for(let c=0;c<3;c++)projects.forEach((p,i)=>{let e=document.createElement('div');e.className='tape'+(p.featured?' featured':'');e.style.setProperty('--color',p.color);e.style.setProperty('--text',p.text);const spine=document.createElement('div');spine.className='face spine';const number=document.createElement('span');number.className='tiny';number.textContent=String(i+1);const name=document.createElement('span');name.className='spine-title';name.textContent=p.title.replace(/[-_]+/g,' ');name.title=p.title;const tag=document.createElement('span');tag.className='tiny';tag.textContent='ARQ.';spine.append(number,name,tag);const front=document.createElement('div');front.className='face front';const label=document.createElement('span');label.className='tiny';label.textContent=p.featured?'FEATURED PROJECT':'PROJECT';const art=document.createElement('div');art.className='art';const mark=document.createElement('span');mark.textContent=p.title.slice(0,1).toUpperCase();art.append(mark);const title=document.createElement('span');title.className='cover-title';title.textContent=p.title.replace(/[-_]+/g,' ');title.title=p.title;const type=document.createElement('span');type.className='tiny';type.textContent=p.type;front.append(label,art,title,type);e.append(spine,front);e.onclick=()=>{if(moved)return;let r=rel(c*n+i);if(Math.abs(r)<.5)show();else target=Math.round(s+r)};stage.appendChild(e);tapes.push(e)})}

async function loadReadme(p){if(!p.url||p.hasDescription)return;try{const response=await fetch('https://api.github.com/repos/marcoaandre7-ux/'+encodeURIComponent(p.title)+'/readme',{headers:{Accept:'application/vnd.github.raw+json'}});if(!response.ok)return;const raw=await response.text();const paragraphs=raw.split(/\r?\n\s*\r?\n/).map(x=>x.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/<[^>]*>/g,'').replace(/^[#>*\s-]+/gm,'').replace(/[`*_]/g,'').trim()).filter(x=>x.length>35&&!/^(https?:|\{)/i.test(x));if(paragraphs.length&&dialog.open&&dialog.querySelector('h2').textContent===p.title)dialog.querySelector('p').textContent=paragraphs[0].slice(0,500)}catch(e){console.error(e)}}
